<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qalbimning Malikasiga — Sevgi Sarguzashti</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');
:root{--pink:#ff4d8d;--gold:#ffd700;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;background:#0d0417;color:#fff;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at top,#2c0b3f,#0d0417 80%);z-index:-1}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:22px 14px 60px}
header{text-align:center;margin-bottom:18px}
h1{font-family:'Dancing Script',cursive,serif;font-size:3rem;background:linear-gradient(90deg,#ff7eb3,#ffd700,#ff4d8d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;line-height:1.15}
header p{color:#e2c2ff;font-size:.93rem;max-width:560px;margin:0 auto;line-height:1.6}
.screen{display:none}
.screen.on{display:block;animation:fadeUp .5s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,141,.7)}50%{box-shadow:0 0 0 16px rgba(255,77,141,0)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shk{animation:shk .4s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes tw{50%{opacity:.15}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes chest{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
@keyframes boom{0%{transform:scale(1);filter:brightness(1)}60%{transform:scale(1.6);filter:brightness(2)}100%{transform:scale(2.4);opacity:0}}

/* map */
.prog{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pt{font-size:.8rem;color:#d8b4f8;margin-right:4px}
.pl{width:34px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(255,255,255,.35);transition:.4s}
.pl.on{background:linear-gradient(135deg,#ff4d8d,#ffd700);color:#1a062b;border-color:#fff;box-shadow:0 0 14px rgba(255,215,0,.6)}
.map{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:100/170}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.sg{fill:none;stroke:rgba(255,255,255,.28);stroke-width:.8;stroke-dasharray:1.2 1.8;stroke-linecap:round}
.sg.on{stroke:var(--gold);stroke-dasharray:none;stroke-width:1}
.nd{position:absolute;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:2px solid var(--bd);background:rgba(255,255,255,.08);font-size:1.9rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.nd.lock{filter:grayscale(.8);opacity:.6}
.nd.cur{background:linear-gradient(135deg,#ff4d8d,#c31432);border-color:#fff;animation:pulse 1.6s infinite}
.nd.done{background:linear-gradient(135deg,#7b2cbf,#c77dff);border-color:var(--gold)}
.nd .lb2{position:absolute;top:100%;margin-top:6px;white-space:nowrap;font:500 .74rem 'Poppins',sans-serif;color:#ffd6e7;pointer-events:none;text-shadow:0 1px 6px #000}
.nd .ck{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2b0c3d;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.foot{text-align:center;margin-top:34px}
.lnk{background:none;border:0;color:#d8b4f8;text-decoration:underline;font:400 .85rem 'Poppins',sans-serif;cursor:pointer}

/* generic */
.panel{background:var(--glass);border:1px solid var(--bd);border-radius:24px;padding:22px 16px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.gtop{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{background:var(--glass);border:1px solid var(--bd);color:#fff;border-radius:20px;padding:8px 14px;font:500 .85rem 'Poppins',sans-serif;cursor:pointer;flex:none}
.gtop h2{font-size:1.35rem;color:#ffb3d1;flex:1;text-align:center;padding-right:70px}
.gt{text-align:center;font-size:1.45rem;color:#ffb3d1;margin-bottom:8px}
.gd{text-align:center;font-size:.9rem;color:#d8b4f8;margin:6px auto 16px;max-width:560px;line-height:1.6}
.btn{background:linear-gradient(135deg,#ff4d8d,#ff758c);color:#fff;border:0;padding:12px 26px;border-radius:30px;font:600 1rem 'Poppins',sans-serif;cursor:pointer;box-shadow:0 5px 18px rgba(255,77,141,.4);transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn.sm{padding:8px 16px;font-size:.85rem}
.btn.gh{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--bd)}
.btn.big{font-size:1.15rem;padding:14px 32px}
.ctr{text-align:center;margin:12px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.banner{min-height:54px;background:rgba(255,77,141,.15);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px;margin:12px auto;max-width:600px;color:#ffe6f0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.92rem;line-height:1.5}
.stats{display:flex;justify-content:center;gap:25px;margin-bottom:12px;color:#ffd6e7;font-size:.95rem}
.stp{text-align:center;color:#ffb3d1;margin-bottom:6px}
.msg{min-height:24px;text-align:center;color:#ffd700;font-size:.92rem;margin-top:8px}
.cv{width:100%;max-width:600px;height:auto;aspect-ratio:600/380;background:radial-gradient(circle,#1b0a33,#090214);border:2px solid rgba(255,133,179,.35);border-radius:18px;display:block;margin:0 auto 12px;touch-action:none}
.cv.mz{max-width:360px;aspect-ratio:360/440}

/* memory */
.grid{display:grid;gap:8px;max-width:460px;margin:0 auto 14px}
.grid.g5{grid-template-columns:repeat(5,1fr)}
.card{aspect-ratio:1;perspective:800px;cursor:pointer}
.in{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}
.card.f .in,.card.m .in{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;border:1px solid rgba(255,255,255,.25)}
.fr{background:linear-gradient(135deg,#3a1257,#1f0833);color:#ff85b3}
.bk{background:linear-gradient(135deg,#ff4d8d,#9b23ea);transform:rotateY(180deg)}
.card.m .bk{background:linear-gradient(135deg,#ffd700,#ff4d8d);box-shadow:0 0 14px rgba(255,215,0,.6)}

/* tiles */
.slots{display:flex;justify-content:center;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
.slot{width:38px;height:46px;border-radius:10px;border:2px dashed rgba(255,215,0,.5);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:var(--gold)}
.slot.f{border-style:solid;background:rgba(255,215,0,.12)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tile{width:44px;height:50px;border-radius:12px;border:1px solid var(--bd);background:linear-gradient(135deg,#ff4d8d,#9b23ea);color:#fff;font:700 1.3rem 'Poppins',sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.tile:disabled{opacity:.2;cursor:default}

/* quiz */
.quiz{max-width:580px;margin:0 auto;text-align:center}
.q{font-size:1.1rem;font-weight:600;color:#ffe0ed;margin-bottom:16px;background:rgba(255,255,255,.06);padding:16px;border-radius:16px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.opt{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);color:#fff;padding:14px 16px;border-radius:14px;font:400 .98rem 'Poppins',sans-serif;cursor:pointer;text-align:left}
.opt.good{background:rgba(80,220,140,.25);border-color:#5ee6a0}
.opt.bad{background:rgba(255,70,90,.2);border-color:#ff5a6e;opacity:.7}

/* sky */
.sky{width:100%;max-width:520px;display:block;margin:0 auto;background:radial-gradient(circle,#1b0a33,#090214);border:2px solid rgba(255,133,179,.35);border-radius:18px}
.sky .tw{animation:tw 3s infinite}
.sky .st{cursor:pointer}
.sky .st.nx .h{animation:tw 1s infinite}
.sky .hf{transition:fill 1.5s}

/* dpad */
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:". u ." "l d r";gap:8px;justify-content:center;margin-top:10px}
.dpad button{height:54px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.1);color:#fff;font-size:1.3rem;cursor:pointer}
.dpad button:active{background:rgba(255,77,141,.5)}

/* reward modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,2,20,.78);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.rcard{max-width:440px;width:100%;background:linear-gradient(160deg,#2b0c3d,#4c1152);border:2px solid var(--gold);border-radius:24px;padding:26px 20px;text-align:center;animation:pop .5s;box-shadow:0 0 50px rgba(255,77,141,.4)}
.rbig{font-size:3.2rem;animation:beat 1.4s infinite}
.rt{font-family:'Dancing Script',cursive,serif;font-size:1.9rem;color:var(--gold);margin:4px 0}
.rlet{font:700 4rem 'Dancing Script',cursive,serif;color:var(--gold);text-shadow:0 0 26px var(--gold);line-height:1.1}
.rm{color:#ffe6f2;line-height:1.75;font-size:.97rem;margin:10px 0}
.rn{color:#d8b4f8;font-size:.82rem;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:rgba(30,8,50,.95);border:1px solid var(--gold);color:#ffe6f0;padding:11px 18px;border-radius:20px;font-size:.88rem;opacity:0;pointer-events:none;transition:.35s;z-index:80;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* final */
.chest{font-size:6rem;text-align:center;margin:10px 0;animation:chest 2.4s infinite}
.chest.open{animation:boom 2.2s forwards}
.letter{background:linear-gradient(180deg,#fff9fb,#ffeef5);color:#3b0d2c;padding:26px 22px;border-radius:18px;max-width:540px;margin:0 auto;box-shadow:0 12px 35px rgba(255,77,141,.45);border:2px solid #ff9ec4;text-align:left}
.letter h3{font-family:'Dancing Script',cursive,serif;font-size:2.1rem;color:#d61c59;margin-bottom:10px;text-align:center}
.letter p{font-size:.96rem;line-height:1.75;margin-bottom:11px}
.sig{text-align:right;font-family:'Dancing Script',cursive,serif;font-size:1.7rem;color:#d61c59;margin-top:10px}
.sw2{position:relative;max-width:420px;margin:0 auto;min-height:270px;border-radius:20px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 30px rgba(255,215,0,.35)}
.gift{padding:26px 20px;text-align:center;background:linear-gradient(160deg,#4c1152,#2b0c3d);min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.gift .gi{font-size:3.4rem;animation:beat 1.4s infinite}
.gift h3{font-family:'Dancing Script',cursive,serif;font-size:2rem;color:var(--gold);margin:6px 0}
.gift p{color:#ffe6f2;line-height:1.7;font-size:.95rem}
.sw2 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.bigH{font-size:4.5rem;text-align:center;animation:beat 1.2s infinite}
.qt{font-family:'Dancing Script',cursive,serif;font-size:2rem;color:#ffd1e3;text-align:center;line-height:1.35;margin:10px 0 24px}
.yn{position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:18px}
#no{transition:transform .25s}
.fin{text-align:center;padding:10px 0}
.fn{font-family:'Dancing Script',cursive,serif;font-size:3.4rem;background:linear-gradient(90deg,#ff7eb3,#ffd700,#ff4d8d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:4px 0 14px}
.fl{opacity:0;animation:fadeUp 1.3s forwards;color:#ffe6f2;line-height:1.8;margin:10px auto;max-width:480px;font-size:1rem}
.fl.b{font-family:'Dancing Script',cursive,serif;font-size:2.2rem;color:var(--gold);line-height:1.3}
@media(max-width:500px){h1{font-size:2.4rem}.nd{width:60px;height:60px;font-size:1.7rem}.gtop h2{font-size:1.1rem;padding-right:56px}.fn{font-size:2.8rem}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
/* intro (poyezd yoʻli oʻyini + parol) */
body.lock{overflow:hidden}
body.lock .wrap{visibility:hidden}
.intro{position:fixed;inset:0;z-index:100;background:#07040d;color:#fff;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;transition:opacity .7s,background .5s;overflow:hidden}
.intro.out{opacity:0;pointer-events:none}
.intro.lit{background:radial-gradient(circle at top,#3b1058,#14061f 80%)}
.intro.run{background:#07040d;padding:0}
.ibox{max-width:460px;width:100%;position:relative;z-index:2}
.ig-ic{font-size:4rem;margin-bottom:10px}
.rv-t{font-family:'Dancing Script',cursive,serif;font-size:2.4rem;color:var(--gold);margin-bottom:8px;line-height:1.15}
.rv-p{color:#ffe6f2;line-height:1.7;margin-bottom:18px;font-size:1rem}
.how{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.how span{background:rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:14px;padding:7px 12px;font-size:.85rem;color:#ffd6e7}
.how2{font-size:.82rem;color:#c9a9e8;margin-bottom:20px}
.rw{position:absolute;top:0;bottom:0;left:50%;width:min(100vw,64vh);transform:translateX(-50%);overflow:hidden;box-shadow:0 0 70px rgba(255,77,141,.28)}
.rw canvas{width:100%;height:100%;display:block;touch-action:none}
.rh{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));padding:0 12px;pointer-events:none}
.rsl{display:flex;justify-content:center;gap:6px}
.rs{width:38px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(10,4,24,.6);display:flex;align-items:center;justify-content:center;font:700 1.35rem 'Poppins',sans-serif;color:rgba(255,255,255,.3)}
.rs.nx{border-color:var(--gold);color:var(--gold)}
.rs.on{background:linear-gradient(135deg,#ff4d8d,#ffd700);color:#1a062b;border-color:#fff;box-shadow:0 0 14px rgba(255,215,0,.7)}
.rs.pop{animation:pop .5s}
.rin{display:flex;justify-content:space-between;margin-top:8px;font:600 1rem 'Poppins',sans-serif;text-shadow:0 2px 6px #000}
.rmsg{position:absolute;left:0;right:0;top:27%;text-align:center;font:800 3rem 'Poppins',sans-serif;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.75);pointer-events:none;padding:0 14px;line-height:1.25;transition:opacity .3s;opacity:0}
.rmsg.small{font-size:1.2rem;font-weight:700}
.rdlg{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);background:rgba(20,6,38,.93);border:2px solid var(--gold);border-radius:22px;padding:22px 16px;text-align:center;animation:pop .45s}
.rwin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,2,20,.5);text-align:center;padding:16px}
.rwin .wn{font:900 3.4rem 'Poppins',sans-serif;background:linear-gradient(90deg,#ffd700,#ff4d8d,#ffd700);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:pop .7s;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.rwin .wl{margin:14px 0}
.rwin .wl span{display:inline-block;margin:0 4px;font:800 2.3rem 'Poppins',sans-serif;color:var(--gold);text-shadow:0 0 18px rgba(255,215,0,.8);animation:pop .5s both}
.rwin p{color:#ffe6f2;font-size:1.05rem}
.btn.dk{background:#2a0505}
.pw{width:100%;padding:14px;border-radius:25px;border:2px solid #ff85b3;background:rgba(0,0,0,.35);color:#fff;font:600 1.1rem 'Poppins',sans-serif;text-align:center;letter-spacing:4px;outline:0;-webkit-user-select:text;user-select:text;text-transform:uppercase;margin-bottom:6px}
</style>
</head>
<body class="lock">
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div class="wrap">
<header>
<h1>Qalbimning Malikasiga ❤️</h1>
<p>Bu — sening sarguzashting. Xaritadagi har bir nuqta yangi oʻyin va yangi sirni yashirgan. Yoʻl oxirida esa seni eng aziz sovgʻa kutmoqda…</p>
</header>

<section id="sMap" class="screen on">
<div class="prog" id="prog"></div>
<div class="map" id="map"><svg id="mpath" viewBox="0 0 100 170"></svg></div>
<p class="foot"><button class="lnk" onclick="resetAll()">Sarguzashtni boshidan boshlash</button></p>
</section>

<section id="sGame" class="screen">
<div class="panel">
<div class="gtop"><button class="back" onclick="toMap()">← Xarita</button><h2 id="gT"></h2></div>
<p class="gd" id="gD"></p>
<div id="gc"></div>
</div>
</section>

<section id="sFinal" class="screen"></section>
</div>

<div class="modal" id="rw">
<div class="rcard">
<div class="rbig" id="rI"></div>
<div class="rt" id="rT"></div>
<div class="rlet" id="rL"></div>
<p class="rm" id="rM"></p>
<p class="rn" id="rN"></p>
<button class="btn" id="rB" onclick="closeR()">Davom etish 💞</button>
</div>
</div>
<div class="intro" id="sIntro"><div class="ibox" id="iBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ SOZLAMALAR (shu yerni oʻzingga moslab oʻzgartirishing mumkin) ============ */
var CFG={
  name:"MADINA", // 6 harfli ism boʻlsa eng yaxshi (oltita oʻyin — oltita harf)
  password:"SEVGI", // kirish paroli (katta-kichik harf farqi yoʻq)
  passHint:"Qalbimizdagi eng chiroyli tuygʻu — 5 harf 💞", // 2 marta xato qilsa chiqadigan maslahat
  giftTitle:"Senga atalgan sovgʻa",
  giftText:"Seni juda yaqin orada ajoyib bir syurpriz kutmoqda! Uni oʻz qoʻlim bilan topshiraman, yuzingdagi tabassumni koʻrish esa men uchun eng katta sovgʻa boʻladi.",
  question:"Qalbimning malikasi boʻlib, hayotimning har kunida yonimda qolasanmi?"
};
/* ======================================================================================= */

var $=function(i){return document.getElementById(i)};
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function R(a,b){return a+Math.random()*(b-a)}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function shake(e){e.classList.remove('shk');void e.offsetWidth;e.classList.add('shk')}
function nm(){return CFG.name.charAt(0).toUpperCase()+CFG.name.slice(1).toLowerCase()}
var LET=CFG.name.toUpperCase().split('');
function letterFor(i){return LET[i%LET.length]}
var FIN='';for(var q=0;q<6;q++)FIN+=letterFor(q);

/* ---------- audio (yumshoq, musiqali) ---------- */
var AC=window.AudioContext||window.webkitAudioContext,ac=null,mb=null,PENT=[392,440,523,587,659,784,880];
function actx(){
  if(!ac){ac=new AC();var m=ac.createGain();m.gain.value=.9;var dl=ac.createDelay(1);dl.delayTime.value=.28;var fb=ac.createGain();fb.gain.value=.3;var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
    m.connect(ac.destination);m.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(ac.destination);mb=m}
  if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,t,v){
  try{
    var a=actx(),soft=(t==='sawtooth'||t==='square');
    while(f>880)f/=2;if(soft)f=Math.min(f,200);
    var now=a.currentTime,vol=(v||.1)*(soft?.8:1),dur=Math.max(d*3,.4)*(soft?.5:1);
    var g=a.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
